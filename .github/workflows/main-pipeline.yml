name: "AWS CI/CD Pipeline"

on:
  push:
    branches:
      - dev
      - staging
      - main
  pull_request:
    branches:
      - dev
      - staging
      - main

# Least privilege by default; jobs that need OIDC request id-token explicitly
permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  # Role ARNs are not secret. Hardcoded to rule out a stale AWS_ROLE_ARN secret.
  AWS_ROLE_ARN: arn:aws:iam::074002960123:role/github-actions-react-deploy
  TOFU_VERSION: "1.8.8"
  TG_VERSION: "0.77.22"
  TG_NON_INTERACTIVE: "true"
  TF_IN_AUTOMATION: "true"

jobs:
  # Step 1: Detect Target Environment based on Git Branch
  set-env:
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.select_env.outputs.target_env }}
    steps:
      - id: select_env
        env:
          # PRs target a branch via base_ref; pushes use ref_name
          BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          if [ "$BRANCH" == "main" ]; then
            echo "target_env=prod" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" == "staging" ]; then
            echo "target_env=staging" >> $GITHUB_OUTPUT
          else
            echo "target_env=dev" >> $GITHUB_OUTPUT
          fi

  # Step 3a: Plan (runs on PRs and pushes, no approval needed)
  plan:
    name: Infrastructure Plan
    needs: set-env
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # TEMPORARY DEBUG: prints OIDC claims (not the token) -- remove once auth works
      - name: Debug OIDC claims
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | { read p; echo "$p$(printf '=%.0s' 1 2 3)" | base64 -d 2>/dev/null; } | jq '{iss, aud, sub}'
          echo "Role ARN secret set: $([ -n "$ROLE_ARN" ] && echo yes || echo NO)"
          ACCT=$(echo "$ROLE_ARN" | cut -d: -f5)
          echo "Role account (last 4 digits): ${ACCT: -4}"
          echo "Role name: ${ROLE_ARN##*/}"
          echo "Job: ${{ github.job }}  Ref: ${{ github.ref }}  Event: ${{ github.event_name }}"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terragrunt Plan
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tg_version: ${{ env.TG_VERSION }}
          tg_dir: "infra/live/${{ needs.set-env.outputs.target_env }}/frontend"
          tg_command: "plan"

  # Step 3b: Apply (push only; the GitHub Environment enforces required reviewers for prod)
  infrastructure:
    name: Infrastructure Apply
    needs: [set-env, plan]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.target_env }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terragrunt Apply
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tg_version: ${{ env.TG_VERSION }}
          tg_dir: "infra/live/${{ needs.set-env.outputs.target_env }}/frontend"
          tg_command: "apply"

  # Step 4: React App Build & S3/CloudFront Deployment
  deploy-app:
    needs: [set-env, infrastructure]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.target_env }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install & Build React App
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync Build to S3 & Invalidate CloudFront Cache
        env:
          ENV: ${{ needs.set-env.outputs.target_env }}
        run: |
          # Single source of truth: the bucket name in the env's terragrunt.hcl
          BUCKET_NAME=$(sed -nE 's/^[[:space:]]*bucket_name[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "infra/live/$ENV/frontend/terragrunt.hcl")
          if [ -z "$BUCKET_NAME" ]; then
            echo "::error::bucket_name not found for $ENV"
            exit 1
          fi

          aws s3 sync ./frontend/build "s3://$BUCKET_NAME" --delete

          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Origins.Items[0].DomainName=='${BUCKET_NAME}.s3.${AWS_REGION}.amazonaws.com'].Id | [0]" \
            --output text)

          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
            echo "Invalidating CloudFront cache for Distribution ID: $DIST_ID"
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          else
            echo "::error::CloudFront distribution not found for $BUCKET_NAME"
            exit 1
          fi
